name: Build L'Ordre Caché 3D Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordre-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate scripts, 3D scene and puzzle rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Record build metadata
        run: |
          mkdir -p build/reports
          godot --version | tee build/reports/godot-version.txt
          git rev-parse HEAD | tee build/reports/git-commit.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' | tee build/reports/build-time-utc.txt

      - name: Import and parse all referenced resources
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee build/import.log

      - name: Run regression tests
        shell: bash
        timeout-minutes: 4
        run: |
          set -o pipefail
          mkdir -p build
          timeout --signal=TERM --kill-after=10s 180s godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee build/smoke-test.log
          grep -F 'SMOKE_TEST_OK:' build/smoke-test.log

      - name: Package source snapshot and validation reports
        if: always()
        shell: bash
        run: |
          mkdir -p build/reports
          cp build/import.log build/reports/import.log 2>/dev/null || true
          cp build/smoke-test.log build/reports/smoke-test.log 2>/dev/null || true
          tar --exclude='./.git' --exclude='./.godot' --exclude='./build' -czf build/lordre-cache-source.tar.gz .

      - name: Upload validation logs, reports and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lordre-cache-validation-${{ github.run_number }}
          path: |
            build/reports/**
            build/import.log
            build/smoke-test.log
            build/lordre-cache-source.tar.gz
          if-no-files-found: warn
          retention-days: 14

  android-apk:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Godot 4.4.1 and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Android paths and debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF_SETTINGS
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"

      - name: Import textures and export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android build/reports
          grep -F 'textures/vram_compression/import_etc2_astc=true' project.godot
          rm -rf .godot
          godot --headless --editor --path . --quit 2>&1 | tee build/reports/android-import.log
          godot --headless --path . --export-debug "Android" build/android/LOrdreCache-3D-debug.apk 2>&1 | tee build/reports/android-export.log
          test -s build/android/LOrdreCache-3D-debug.apk
          sha256sum build/android/LOrdreCache-3D-debug.apk | tee build/reports/apk-sha256.txt

      - name: Upload APK and Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lordre-cache-3d-android-apk-${{ github.run_number }}
          path: |
            build/android/LOrdreCache-3D-debug.apk
            build/reports/android-import.log
            build/reports/android-export.log
            build/reports/apk-sha256.txt
          if-no-files-found: warn
          retention-days: 30
